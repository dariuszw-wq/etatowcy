<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, system-ui, sans-serif" role="img">
<rect width="1200" height="675" fill="#ffffff"/>
<text x="60" y="64" font-size="30" font-weight="700" fill="#0f1420">Power of attorney at a Polish office — do you pay the PLN 17?</text>
<text x="60" y="97" font-size="17" fill="#4b5566">the fee is charged per relationship of representation, not per sheet of paper</text>
<rect x="60" y="130" width="1080" height="116" rx="14" fill="#fdf2ee" stroke="#f0cdbf"/>
<rect x="60" y="130" width="6" height="116" rx="3" fill="#d9451f"/>
<text x="96" y="172" font-size="22" font-weight="700" fill="#d9451f">YOU PAY PLN 17</text>
<text x="96" y="204" font-size="16" fill="#4b5566">each representative separately • each substitute power separately • each set of proceedings separately</text>
<text text-anchor="end" x="1110" y="230" font-size="14" fill="#8a94a3">Annex, part IV</text>
<text x="60" y="296" font-size="20" font-weight="700" fill="#0f1420">YOU DO NOT PAY when:</text>
<rect x="60" y="320" width="1080" height="104" rx="14" fill="#f3f6fa" stroke="#d8dde5"/>
<rect x="60" y="320" width="6" height="104" rx="3" fill="#0b6fc2"/>
<circle cx="112" cy="372" r="17" fill="#0b6fc2"/>
<path d="M104 372 l6 6 l12 -13" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="148" y="370" font-size="18" font-weight="600" fill="#0f1420">the representative is a spouse, ascendant, descendant or sibling</text>
<text x="148" y="396" font-size="14" fill="#8a94a3">Annex, part IV, col. 4</text>
<rect x="60" y="436" width="1080" height="104" rx="14" fill="#f3f6fa" stroke="#d8dde5"/>
<rect x="60" y="436" width="6" height="104" rx="3" fill="#0b6fc2"/>
<circle cx="112" cy="488" r="17" fill="#0b6fc2"/>
<path d="M104 488 l6 6 l12 -13" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="148" y="486" font-size="18" font-weight="600" fill="#0f1420">the representative or commercial proxy is entered in CEIDG or KRS</text>
<text x="148" y="512" font-size="14" fill="#8a94a3">Art. 30a of the Entrepreneurs Law</text>
<rect x="60" y="552" width="1080" height="104" rx="14" fill="#f3f6fa" stroke="#d8dde5"/>
<rect x="60" y="552" width="6" height="104" rx="3" fill="#0b6fc2"/>
<circle cx="112" cy="604" r="17" fill="#0b6fc2"/>
<path d="M104 604 l6 6 l12 -13" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="148" y="602" font-size="18" font-weight="600" fill="#0f1420">the case concerns social or health insurance (ZUS)</text>
<text x="148" y="628" font-size="14" fill="#8a94a3">Art. 2(1)(1)(b)</text>
</svg>
