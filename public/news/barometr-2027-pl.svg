<text x="140" y="305" font-size="17" font-weight="700" fill="#0f1420">Edukacyjna</text>
<text x="140" y="328" font-size="13.5" fill="#4b5566">nauczyciele praktycznej nauki zawodu • nauczyciele przedmiotów zawodowych • nauczyciele szkół specjalnych</text>
