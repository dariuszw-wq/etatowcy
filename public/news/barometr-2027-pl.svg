<text x="140" y="149" font-size="17" font-weight="700" fill="#0f1420">Medyczno-opiekuńcza</text>
<text x="140" y="172" font-size="13.5" fill="#4b5566">lekarze • opiekunowie osób starszych lub z niepełnosprawnością • pielęgniarki i położne • psycholodzy i terapeuci</text>
