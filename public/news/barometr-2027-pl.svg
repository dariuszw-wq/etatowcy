<text x="140" y="227" font-size="17" font-weight="700" fill="#0f1420">Transport i logistyka</text>
<text x="140" y="250" font-size="13.5" fill="#4b5566">kierowcy autobusów • kierowcy samochodów ciężarowych i ciągników siodłowych • magazynierzy</text>
