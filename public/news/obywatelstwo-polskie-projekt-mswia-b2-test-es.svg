<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, system-ui, sans-serif" role="img">
<rect width="1200" height="675" fill="#ffffff"/>
<text x="60" y="66" font-size="31" font-weight="700" fill="#0f1420">Nacionalidad polaca: hoy y en el proyecto del MSWiA</text>
<text x="60" y="100" font-size="18" fill="#4b5566">reconocimiento por el voivoda · proyecto UD491 de 27.10.2026 — aún no es ley</text>
<rect x="60" y="128" width="1080" height="40" rx="10" fill="#0f1420"/>
<text x="84" y="154" font-size="16" font-weight="700" fill="#ffffff">Requisito</text>
<text x="380" y="154" font-size="16" font-weight="700" fill="#ffffff">Hoy (ley de 2009)</text>
<text x="790" y="154" font-size="16" font-weight="700" fill="#ffffff">En el proyecto</text>
<rect x="60" y="178" width="1080" height="50" rx="10" fill="#f3f6fa" stroke="#d8dde5"/>
<rect x="776" y="178" width="364" height="50" rx="10" fill="#e8f1fa"/>
<rect x="60" y="178" width="6" height="50" rx="3" fill="#0b6fc2"/>
<text x="84" y="209" font-size="17" font-weight="700" fill="#0f1420">Residencia</text>
<text x="380" y="209" font-size="17" fill="#4b5566">normalmente 3 años de residencia permanente</text>
<text x="790" y="209" font-size="17" font-weight="700" fill="#0b4f8a">más larga — aún sin cifra</text>
<rect x="60" y="234" width="1080" height="50" rx="10" fill="#f3f6fa" stroke="#d8dde5"/>
<rect x="776" y="234" width="364" height="50" rx="10" fill="#e8f1fa"/>
<rect x="60" y="234" width="6" height="50" rx="3" fill="#0b6fc2"/>
<text x="84" y="265" font-size="17" font-weight="700" fill="#0f1420">Idioma polaco</text>
<text x="380" y="265" font-size="17" fill="#4b5566">certificado B1</text>
<text x="790" y="265" font-size="17" font-weight="700" fill="#0b4f8a">B2</text>
<rect x="60" y="290" width="1080" height="50" rx="10" fill="#f3f6fa" stroke="#d8dde5"/>
<rect x="776" y="290" width="364" height="50" rx="10" fill="#e8f1fa"/>
<rect x="60" y="290" width="6" height="50" rx="3" fill="#0b6fc2"/>
<text x="84" y="321" font-size="17" font-weight="700" fill="#0f1420">Examen cívico</text>
<text x="380" y="321" font-size="17" fill="#4b5566">no</text>
<text x="790" y="321" font-size="17" font-weight="700" fill="#0b4f8a">examen sobre Polonia</text>
<rect x="60" y="346" width="1080" height="50" rx="10" fill="#f3f6fa" stroke="#d8dde5"/>
<rect x="776" y="346" width="364" height="50" rx="10" fill="#e8f1fa"/>
<rect x="60" y="346" width="6" height="50" rx="3" fill="#0b6fc2"/>
<text x="84" y="377" font-size="17" font-weight="700" fill="#0f1420">Declaración de lealtad</text>
<text x="380" y="377" font-size="17" fill="#4b5566">no</text>
<text x="790" y="377" font-size="17" font-weight="700" fill="#0b4f8a">obligatoria</text>
<rect x="60" y="402" width="1080" height="50" rx="10" fill="#f3f6fa" stroke="#d8dde5"/>
<rect x="776" y="402" width="364" height="50" rx="10" fill="#e8f1fa"/>
<rect x="60" y="402" width="6" height="50" rx="3" fill="#0b6fc2"/>
<text x="84" y="433" font-size="17" font-weight="700" fill="#0f1420">Ingresos y vivienda</text>
<text x="380" y="433" font-size="17" fill="#4b5566">solo en algunas vías</text>
<text x="790" y="433" font-size="17" font-weight="700" fill="#0b4f8a">para todos + ingreso mínimo</text>
<rect x="60" y="458" width="1080" height="50" rx="10" fill="#f3f6fa" stroke="#d8dde5"/>
<rect x="776" y="458" width="364" height="50" rx="10" fill="#e8f1fa"/>
<rect x="60" y="458" width="6" height="50" rx="3" fill="#0b6fc2"/>
<text x="84" y="489" font-size="17" font-weight="700" fill="#0f1420">Centro de vida</text>
<text x="380" y="489" font-size="17" fill="#4b5566">no</text>
<text x="790" y="489" font-size="17" font-weight="700" fill="#0b4f8a">en Polonia + residencia fiscal</text>
<rect x="60" y="514" width="1080" height="50" rx="10" fill="#f3f6fa" stroke="#d8dde5"/>
<rect x="776" y="514" width="364" height="50" rx="10" fill="#e8f1fa"/>
<rect x="60" y="514" width="6" height="50" rx="3" fill="#0b6fc2"/>
<text x="84" y="545" font-size="17" font-weight="700" fill="#0f1420">Denegación y anulación</text>
<text x="380" y="545" font-size="17" fill="#4b5566">sin requisitos / amenaza</text>
<text x="790" y="545" font-size="17" font-weight="700" fill="#0b4f8a">condenas, multas, fraude; anulación</text>
<rect x="60" y="576" width="1080" height="58" rx="12" fill="#fff6f2" stroke="#f1cbbd"/>
<rect x="60" y="576" width="6" height="58" rx="3" fill="#d9451f"/>
<text x="90" y="611" font-size="17" font-weight="600" fill="#0f1420">Si hoy cumples los requisitos, valora solicitarla antes del cambio; el régimen transitorio lo fijará el proyecto.</text>
</svg>
