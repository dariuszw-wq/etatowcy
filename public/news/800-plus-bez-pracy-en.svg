<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, system-ui, sans-serif" role="img">
<rect width="1200" height="675" fill="#ffffff"/>
<text x="60" y="66" font-size="31" font-weight="700" fill="#0f1420">800+ without the work condition — when a foreign parent qualifies</text>
<text x="60" y="100" font-size="18" fill="#4b5566">the work-activity condition (Art. 1(2a)) does not apply if the child:</text>
<rect x="60" y="136" width="1080" height="112" rx="14" fill="#f3f6fa" stroke="#d8dde5"/>
<rect x="60" y="136" width="6" height="112" rx="3" fill="#0b6fc2"/>
<circle cx="112" cy="192" r="21" fill="#0b6fc2"/>
<text x="112" y="200" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="150" y="186" font-size="20" font-weight="700" fill="#0f1420">Is a Polish citizen</text>
<text x="150" y="214" font-size="16" fill="#4b5566">whatever the parent’s residence status</text>
<text text-anchor="end" x="1110" y="232" font-size="15" fill="#4b5566">Art. 1(2a) sent. 2</text>
<rect x="60" y="264" width="1080" height="112" rx="14" fill="#f3f6fa" stroke="#d8dde5"/>
<rect x="60" y="264" width="6" height="112" rx="3" fill="#0b6fc2"/>
<circle cx="112" cy="320" r="21" fill="#0b6fc2"/>
<text x="112" y="328" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="150" y="314" font-size="20" font-weight="700" fill="#0f1420">Holds a disability certificate</text>
<text x="150" y="342" font-size="16" fill="#4b5566">or one of moderate or severe degree</text>
<text text-anchor="end" x="1110" y="360" font-size="15" fill="#4b5566">Art. 1(2a) sent. 2</text>
<rect x="60" y="392" width="1080" height="112" rx="14" fill="#f3f6fa" stroke="#d8dde5"/>
<rect x="60" y="392" width="6" height="112" rx="3" fill="#0b6fc2"/>
<circle cx="112" cy="448" r="21" fill="#0b6fc2"/>
<text x="112" y="456" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="150" y="455" font-size="20" font-weight="700" fill="#0f1420">Is in the care of a guardian appointed by the country of origin</text>
<text text-anchor="end" x="1110" y="488" font-size="15" fill="#4b5566">Art. 1(2a) sent. 2</text>
<text x="60" y="548" font-size="18" font-weight="600" fill="#0f1420">Not working and none of these applies?</text>
<rect x="60" y="568" width="1080" height="96" rx="14" fill="#f3f6fa" stroke="#d8dde5"/>
<rect x="60" y="568" width="6" height="96" rx="3" fill="#d9451f"/>
<text x="96" y="610" font-size="20" font-weight="700" fill="#0f1420">Registered unemployed — 800+ for 3 months</text>
<text x="96" y="638" font-size="16" fill="#4b5566">6 months with three or more children; once per benefit period</text>
<text text-anchor="end" x="1110" y="648" font-size="15" fill="#4b5566">Art. 1(2b)–(2c)</text>
</svg>
