<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, system-ui, sans-serif" role="img">
<rect width="1200" height="675" fill="#ffffff"/>
<text x="60" y="66" font-size="31" font-weight="700" fill="#0f1420">Polish citizenship: today and in the MSWiA draft</text>
<text x="60" y="100" font-size="18" fill="#4b5566">recognition by the voivode · draft UD491 of 27.10.2026 — not yet law</text>
<rect x="60" y="128" width="1080" height="40" rx="10" fill="#0f1420"/>
<text x="84" y="154" font-size="16" font-weight="700" fill="#ffffff">Condition</text>
<text x="380" y="154" font-size="16" font-weight="700" fill="#ffffff">Today (2009 Act)</text>
<text x="790" y="154" font-size="16" font-weight="700" fill="#ffffff">In the draft</text>
<rect x="60" y="178" width="1080" height="50" rx="10" fill="#f3f6fa" stroke="#d8dde5"/>
<rect x="776" y="178" width="364" height="50" rx="10" fill="#e8f1fa"/>
<rect x="60" y="178" width="6" height="50" rx="3" fill="#0b6fc2"/>
<text x="84" y="209" font-size="17" font-weight="700" fill="#0f1420">Period of residence</text>
<text x="380" y="209" font-size="17" fill="#4b5566">usually 3 years on permanent stay</text>
<text x="790" y="209" font-size="17" font-weight="700" fill="#0b4f8a">longer — no figure yet</text>
<rect x="60" y="234" width="1080" height="50" rx="10" fill="#f3f6fa" stroke="#d8dde5"/>
<rect x="776" y="234" width="364" height="50" rx="10" fill="#e8f1fa"/>
<rect x="60" y="234" width="6" height="50" rx="3" fill="#0b6fc2"/>
<text x="84" y="265" font-size="17" font-weight="700" fill="#0f1420">Polish language</text>
<text x="380" y="265" font-size="17" fill="#4b5566">B1 certificate</text>
<text x="790" y="265" font-size="17" font-weight="700" fill="#0b4f8a">B2</text>
<rect x="60" y="290" width="1080" height="50" rx="10" fill="#f3f6fa" stroke="#d8dde5"/>
<rect x="776" y="290" width="364" height="50" rx="10" fill="#e8f1fa"/>
<rect x="60" y="290" width="6" height="50" rx="3" fill="#0b6fc2"/>
<text x="84" y="321" font-size="17" font-weight="700" fill="#0f1420">Civic test</text>
<text x="380" y="321" font-size="17" fill="#4b5566">no</text>
<text x="790" y="321" font-size="17" font-weight="700" fill="#0b4f8a">exam on knowledge of Poland</text>
<rect x="60" y="346" width="1080" height="50" rx="10" fill="#f3f6fa" stroke="#d8dde5"/>
<rect x="776" y="346" width="364" height="50" rx="10" fill="#e8f1fa"/>
<rect x="60" y="346" width="6" height="50" rx="3" fill="#0b6fc2"/>
<text x="84" y="377" font-size="17" font-weight="700" fill="#0f1420">Declaration of loyalty</text>
<text x="380" y="377" font-size="17" fill="#4b5566">no</text>
<text x="790" y="377" font-size="17" font-weight="700" fill="#0b4f8a">mandatory</text>
<rect x="60" y="402" width="1080" height="50" rx="10" fill="#f3f6fa" stroke="#d8dde5"/>
<rect x="776" y="402" width="364" height="50" rx="10" fill="#e8f1fa"/>
<rect x="60" y="402" width="6" height="50" rx="3" fill="#0b6fc2"/>
<text x="84" y="433" font-size="17" font-weight="700" fill="#0f1420">Income and housing</text>
<text x="380" y="433" font-size="17" fill="#4b5566">only in some routes</text>
<text x="790" y="433" font-size="17" font-weight="700" fill="#0b4f8a">for everyone + minimum income</text>
<rect x="60" y="458" width="1080" height="50" rx="10" fill="#f3f6fa" stroke="#d8dde5"/>
<rect x="776" y="458" width="364" height="50" rx="10" fill="#e8f1fa"/>
<rect x="60" y="458" width="6" height="50" rx="3" fill="#0b6fc2"/>
<text x="84" y="489" font-size="17" font-weight="700" fill="#0f1420">Centre of life</text>
<text x="380" y="489" font-size="17" fill="#4b5566">no</text>
<text x="790" y="489" font-size="17" font-weight="700" fill="#0b4f8a">in Poland + tax residence</text>
<rect x="60" y="514" width="1080" height="50" rx="10" fill="#f3f6fa" stroke="#d8dde5"/>
<rect x="776" y="514" width="364" height="50" rx="10" fill="#e8f1fa"/>
<rect x="60" y="514" width="6" height="50" rx="3" fill="#0b6fc2"/>
<text x="84" y="545" font-size="17" font-weight="700" fill="#0f1420">Refusal and annulment</text>
<text x="380" y="545" font-size="17" fill="#4b5566">conditions not met / threat</text>
<text x="790" y="545" font-size="17" font-weight="700" fill="#0b4f8a">convictions, fines, fraud; annulment</text>
<rect x="60" y="576" width="1080" height="58" rx="12" fill="#fff6f2" stroke="#f1cbbd"/>
<rect x="60" y="576" width="6" height="58" rx="3" fill="#d9451f"/>
<text x="90" y="611" font-size="17" font-weight="600" fill="#0f1420">If you qualify today, consider applying before the change — transitional rules will come with the draft.</text>
</svg>
