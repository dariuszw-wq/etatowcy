<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, system-ui, sans-serif" role="img">
<rect width="1200" height="675" fill="#ffffff"/>
<text x="60" y="64" font-size="33" font-weight="700" fill="#0f1420">How long a residence-and-work decision takes</text>
<text x="60" y="98" font-size="18" fill="#4b5566">the directive and the statutory deadline against the average length of proceedings</text>
<rect x="60" y="118" width="13" height="13" rx="3" fill="#0b6fc2"/>
<text x="80" y="129" font-size="16" fill="#0f1420">legal standard</text>
<rect x="226" y="118" width="13" height="13" rx="3" fill="#d9451f"/>
<text x="246" y="129" font-size="16" fill="#0f1420">reality</text>
<line x1="430.3" y1="164" x2="430.3" y2="486" stroke="#0b6fc2" stroke-width="2" stroke-dasharray="6 5" opacity="0.5"/>
<text x="304" y="204" font-size="19" font-weight="600" fill="#0f1420" text-anchor="end">EU directive</text>
<text x="304" y="224" font-size="14" fill="#4b5566" text-anchor="end">required deadline</text>
<rect x="330" y="180" width="100.3" height="36" rx="4" fill="#0b6fc2"/>
<text x="442.3" y="204" font-size="17" font-weight="700" fill="#0b6fc2">90 days</text>
<text x="304" y="286" font-size="19" font-weight="600" fill="#0f1420" text-anchor="end">Act on Foreigners</text>
<text x="304" y="306" font-size="14" fill="#4b5566" text-anchor="end">deadline for a decision</text>
<rect x="330" y="262" width="66.9" height="36" rx="4" fill="#0b6fc2"/>
<text x="408.9" y="286" font-size="17" font-weight="700" fill="#0b6fc2">60 days</text>
<text x="304" y="368" font-size="19" font-weight="600" fill="#0f1420" text-anchor="end">Lublin, Łódź regions</text>
<text x="304" y="388" font-size="14" fill="#4b5566" text-anchor="end">fastest in Poland</text>
<rect x="330" y="344" width="430.1" height="36" rx="4" fill="#d9451f"/>
<text x="344" y="368" font-size="17" font-weight="700" fill="#ffffff">386 days</text>
<text x="304" y="450" font-size="19" font-weight="600" fill="#0f1420" text-anchor="end">Silesia region</text>
<text x="304" y="470" font-size="14" fill="#4b5566" text-anchor="end">slowest in Poland</text>
<rect x="330" y="426" width="733.2" height="36" rx="4" fill="#d9451f"/>
<text x="344" y="450" font-size="17" font-weight="700" fill="#ffffff">658 days</text>
<line x1="60" y1="601" x2="1110" y2="601" stroke="#d8dde5" stroke-width="1"/>
<text x="60" y="629" font-size="15" fill="#4b5566">Average length of temporary-residence proceedings, as at 6 July 2026</text>
<text text-anchor="end" x="1110" y="629" font-size="15" font-weight="600" fill="#0b6fc2">etatowcy.pl</text>
</svg>